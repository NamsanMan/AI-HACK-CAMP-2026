<!DOCTYPE html>
<html>
<head>
    <script src="ort.wasm.min.js"></script>
</head>
<body>
    <script>
        // 모델 추론 세션 변수들
        let yuNetSession = null;
        let skinMaskSession = null;
        let multiTaskSession = null;
        let modelReady = false;

        // 30프레임 4채널 입력을 채우기 위한 실시간 슬라이딩 윈도우 큐
        let frameQueue = [];

        async function initModel() {
            try {
                console.log("[Sandbox] Loading all 3 ONNX models...");
                const base = location.href.substring(0, location.href.lastIndexOf('/') + 1);
                
                ort.env.wasm.numThreads = 1;
                ort.env.wasm.simd = false;
                ort.env.wasm.wasmPaths = {
                    "ort-wasm.wasm": base + "ort-wasm.wasm",
                    "ort-wasm-simd.wasm": base + "ort-wasm-simd.wasm",
                    "ort-wasm-threaded.wasm": base + "ort-wasm-threaded.wasm",
                    "ort-wasm-simd-threaded.wasm": base + "ort-wasm-simd-threaded.wasm"
                };

                // 1. YuNet (얼굴 검출) 로드
                const responseYuNet = await fetch('yunet.onnx');
                const yuNetBuffer = await responseYuNet.arrayBuffer();
                yuNetSession = await ort.InferenceSession.create(new Uint8Array(yuNetBuffer), { executionProviders: ['wasm'] });
                console.log("[Sandbox] 1/3 YuNet loaded.");

                // 2. SkinMaskNet (피부 검출 마스크) 로드
                const responseMask = await fetch('skin_mask.onnx');
                const maskBuffer = await responseMask.arrayBuffer();
                skinMaskSession = await ort.InferenceSession.create(new Uint8Array(maskBuffer), { executionProviders: ['wasm'] });
                console.log("[Sandbox] 2/3 SkinMaskNet loaded.");

                // 3. Multi-Task ReXNet (딥페이크 + 생체신호 분석) 로드
                const responseMulti = await fetch('rexnet_multitask.onnx');
                const multiBuffer = await responseMulti.arrayBuffer();
                multiTaskSession = await ort.InferenceSession.create(new Uint8Array(multiBuffer), { executionProviders: ['wasm'] });
                console.log("[Sandbox] 3/3 MultiTask ReXNet loaded.");
                
                modelReady = true;
                window.parent.postMessage({ type: 'MODEL_LOADED' }, '*');
                console.log("[Sandbox] All models loaded successfully. Pipeline active!");
            } catch (e) {
                console.error("[Sandbox] Model load error:", e);
            }
        }

        window.addEventListener('message', async (event) => {
            const { type, imageData, width, height } = event.data;

            if (type === 'INIT') {
                await initModel();
            } else if (type === 'PREDICT' && modelReady) {
                try {
                    // --- 1단계: YuNet 얼굴 검출을 위한 640x640 변환 ---
                    const targetW = 640;
                    const targetH = 640;
                    const input = new Float32Array(1 * 3 * targetH * targetW);
                    
                    for (let y = 0; y < targetH; y++) {
                        const sourceY = (y >> 1);
                        const sourceRowOffset = sourceY * 320;
                        const destRowOffset = y * targetW;
                        for (let x = 0; x < targetW; x++) {
                            const sourceX = (x >> 1);
                            const srcIdx = (sourceRowOffset + sourceX) * 4;
                            const dstIdx = destRowOffset + x;
                            input[0 * targetH * targetW + dstIdx] = imageData[srcIdx + 2]; // B
                            input[1 * targetH * targetW + dstIdx] = imageData[srcIdx + 1]; // G
                            input[2 * targetH * targetW + dstIdx] = imageData[srcIdx + 0]; // R
                        }
                    }
                    
                    const feeds = {};
                    feeds[yuNetSession.inputNames[0]] = new ort.Tensor('float32', input, [1, 3, targetH, targetW]);
                    const results = await yuNetSession.run(feeds);
                    
                    let bestScore = -1;
                    let centerX = 160, centerY = 160;

                    [8, 16, 32].forEach(stride => {
                        const clsTensor = results[`cls_${stride}`];
                        const bboxTensor = results[`bbox_${stride}`];
                        if (!clsTensor || !bboxTensor) return;
                        
                        const cls = clsTensor.data;
                        const bbox = bboxTensor.data;
                        const dims = clsTensor.dims; 
                        const w = dims.filter(d => d > 1)[1] || (targetH / stride);

                        for (let i = 0; i < cls.length; i++) {
                            if (cls[i] > bestScore) {
                                bestScore = cls[i];
                                const row = Math.floor(i / w);
                                const col = i % w;
                                
                                const offset = i * 14;
                                const dx = bbox[offset + 0] || 0;
                                const dy = bbox[offset + 1] || 0;
                                const dw = bbox[offset + 2] || 0;
                                const dh = bbox[offset + 3] || 0;
                                
                                const faceX = (col + dx) * stride;
                                const faceY = (row + dy) * stride;
                                const faceW = Math.exp(dw) * stride;
                                const faceH = Math.exp(dh) * stride;
                                
                                centerX = (faceX + faceW / 2) / 2;
                                centerY = (faceY + faceH / 2) / 2;
                            }
                        }
                    });

                    const faceDetected = bestScore > 0.35;
                    let croppedFaceData = null;

                    if (faceDetected) {
                        if (typeof window.smoothX === 'undefined') {
                            window.smoothX = centerX; window.smoothY = centerY;
                        }
                        const alpha = 0.15;
                        window.smoothX = window.smoothX * (1 - alpha) + centerX * alpha;
                        window.smoothY = window.smoothY * (1 - alpha) + centerY * alpha;

                        const cropSize = 94;
                        let x1 = Math.max(0, Math.min(320 - cropSize, Math.floor(window.smoothX - cropSize / 2)));
                        let y1 = Math.max(0, Math.min(320 - cropSize, Math.floor(window.smoothY - cropSize / 2)));
                        
                        const facePixels = new Uint8ClampedArray(cropSize * cropSize * 4);
                        for (let r = 0; r < cropSize; r++) {
                            for (let c = 0; c < cropSize; c++) {
                                const srcIdx = ( (y1 + r) * 320 + (x1 + c) ) * 4;
                                const dstIdx = (r * cropSize + c) * 4;
                                facePixels[dstIdx + 0] = imageData[srcIdx + 0]; // R
                                facePixels[dstIdx + 1] = imageData[srcIdx + 1]; // G
                                facePixels[dstIdx + 2] = imageData[srcIdx + 2]; // B
                                facePixels[dstIdx + 3] = imageData[srcIdx + 3]; // A
                            }
                        }
                        
                        croppedFaceData = {
                            pixels: Array.from(facePixels),
                            width: cropSize,
                            height: cropSize
                        };

                        // --- 2단계: SkinMaskNet 추론 및 피부 마스크 추출 (94x94) ---
                        const maskInput = new Float32Array(3 * cropSize * cropSize);
                        const mean = [0.485, 0.456, 0.406];
                        const std = [0.229, 0.224, 0.225];

                        for (let i = 0; i < cropSize * cropSize; i++) {
                            const srcIdx = i * 4;
                            const R = facePixels[srcIdx + 0] / 255.0;
                            const G = facePixels[srcIdx + 1] / 255.0;
                            const B = facePixels[srcIdx + 2] / 255.0;

                            // ImageNet 정규화
                            maskInput[0 * cropSize * cropSize + i] = (R - mean[0]) / std[0];
                            maskInput[1 * cropSize * cropSize + i] = (G - mean[1]) / std[1];
                            maskInput[2 * cropSize * cropSize + i] = (B - mean[2]) / std[2];
                        }

                        const maskFeeds = {};
                        maskFeeds[skinMaskSession.inputNames[0]] = new ort.Tensor('float32', maskInput, [1, 3, cropSize, cropSize]);
                        const maskResults = await skinMaskSession.run(maskFeeds);
                        const maskLogits = maskResults[skinMaskSession.outputNames[0]].data;

                        // 로짓을 시그모이드로 0.0~1.0 마스크로 스케일링
                        const skinMask = new Float32Array(cropSize * cropSize);
                        for (let i = 0; i < cropSize * cropSize; i++) {
                            skinMask[i] = 1.0 / (1.0 + Math.exp(-maskLogits[i]));
                        }

                        // --- 3단계: RGB + 마스크 4채널 병합 데이터 구조 생성 ([4, 94, 94]) ---
                        const frameData = new Float32Array(4 * cropSize * cropSize);
                        for (let i = 0; i < cropSize * cropSize; i++) {
                            const srcIdx = i * 4;
                            frameData[0 * cropSize * cropSize + i] = facePixels[srcIdx + 0] / 255.0; // R
                            frameData[1 * cropSize * cropSize + i] = facePixels[srcIdx + 1] / 255.0; // G
                            frameData[2 * cropSize * cropSize + i] = facePixels[srcIdx + 2] / 255.0; // B
                            frameData[3 * cropSize * cropSize + i] = skinMask[i];                  // Mask
                        }

                        // 슬라이딩 윈도우 관리 (최대 30프레임 유지)
                        frameQueue.push(frameData);
                        if (frameQueue.length > 30) {
                            frameQueue.shift();
                        }

                        // --- 4단계: 30프레임 시계열이 온전히 채워졌을 때만 정밀 추론 진행 ---
                        if (frameQueue.length === 30) {
                            const multiTaskInput = new Float32Array(30 * 4 * cropSize * cropSize);
                            for (let t = 0; t < 30; t++) {
                                multiTaskInput.set(frameQueue[t], t * 4 * cropSize * cropSize);
                            }

                            const multiFeeds = {};
                            multiFeeds[multiTaskSession.inputNames[0]] = new ort.Tensor('float32', multiTaskInput, [1, 30, 4, cropSize, cropSize]);
                            const multiResults = await multiTaskSession.run(multiFeeds);

                            // 다중 출력 노드 파싱
                            const rawFakeLogits = multiResults['fake_logits'] ? multiResults['fake_logits'].data[0] : -10.0;
                            const ppgWave = multiResults['ppg_wave'] ? multiResults['ppg_wave'].data : new Float32Array(30);
                            const hrVal = multiResults['hr_val'] ? multiResults['hr_val'].data[0] : 0.0;

                            // 디버깅용: 로우 로짓 콘솔 출력
                            console.log(`[Sandbox] rawFakeLogits: ${rawFakeLogits.toFixed(4)}, hrVal: ${hrVal.toFixed(2)}`);

                            // 극강의 가짜 얼굴 탐지를 위한 민감도 보정 수식 (Threshold 상향 조정)
                            // 딥페이크 요소가 미세하게라도 있을 때 로짓이 -4.0 이상으로 올라가기만 해도 백분율을 99% 급으로 확 올려줍니다.
                            const sensitivityBias = 4.2; 
                            const multiplier = 2.5;
                            const fakeRisk = 1.0 / (1.0 + Math.exp(- (rawFakeLogits + sensitivityBias) * multiplier ));

                            // 최종 수집 결과를 대시보드로 브로드캐스팅
                            window.parent.postMessage({
                                type: 'PREDICT_RESULT',
                                faceDetected: true,
                                score: bestScore,
                                crop: croppedFaceData,
                                fakeRisk: fakeRisk,
                                ppgWave: Array.from(ppgWave),
                                hrVal: hrVal
                            }, '*');
                        } else {
                            // 아직 30프레임이 모이지 않은 대기 상태 (수집 진행률 전송)
                            const fillProgress = frameQueue.length / 30;
                            console.log(`[Sandbox] Collecting frames for sequence: ${frameQueue.length}/30`);
                            window.parent.postMessage({
                                type: 'PREDICT_RESULT',
                                faceDetected: true,
                                score: bestScore,
                                crop: croppedFaceData,
                                fakeRisk: 0.0,
                                ppgWave: new Array(30).fill(0.5),
                                hrVal: 0,
                                collecting: true
                            }, '*');
                        }

                    } else {
                        // 얼굴 미탐지 시 큐 초기화 (다른 사람 얼굴에 대한 잔상 효과 방지)
                        frameQueue = [];
                        window.parent.postMessage({
                            type: 'PREDICT_RESULT',
                            faceDetected: false,
                            score: bestScore,
                            crop: null
                        }, '*');
                    }
                } catch (err) {
                    console.error("[Sandbox] Prediction pipeline error:", err);
                    window.parent.postMessage({ type: 'PREDICT_RESULT', faceDetected: false, error: err.message }, '*');
                }
            }
        });
    </script>
</body>
</html>
